name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_DB: storemesh, POSTGRES_USER: storemesh, POSTGRES_PASSWORD: storemesh-ci}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U storemesh -d storemesh"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://storemesh:storemesh-ci@localhost:5432/storemesh
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: {version: 11.19.0}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm migrate
      - run: pnpm test
